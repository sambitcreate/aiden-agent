[package]
name = "aiden-ui"
description = "Aiden Agent GPUI application shell (port of renderer/** + main/windows/)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aiden"
path = "src/main.rs"

[features]
default = ["dictation", "update-feed"]
# On-device dictation (aiden-mac sherpa + model management). Keep in sync
# with aiden-mac's `dictation` feature.
dictation = ["aiden-mac/dictation"]
# The real generic-feed updater is still runtime-gated to signed, packaged
# macOS builds. Keeping the feature on in release/default builds makes the
# app capable of consuming the embedded feed without adding any development
# network traffic.
update-feed = ["aiden-mac/update-feed"]

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui-tokio-bridge.workspace = true
aiden-core.workspace = true
aiden-data.workspace = true
aiden-git.workspace = true
aiden-mcp.workspace = true
aiden-providers.workspace = true
aiden-agent.workspace = true
aiden-subagents.workspace = true
aiden-scheduler.workspace = true
aiden-mac.workspace = true
aiden-computer-use.workspace = true
tokio.workspace = true
tokio-util = "0.7"
parking_lot.workspace = true
reqwest.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-compat.workspace = true
async-trait = "0.1"
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
chrono.workspace = true
resvg = "0.45"
tiny-skia = "0.11"
usvg = "0.45"
alacritty_terminal = "0.26"
portable-pty = "0.9"
libc = "0.2"
# OS-global hotkey event delivery (dictation pill toggle while another app is
# focused; parity audit config §12). Same pin as aiden-mac.
global-hotkey = "0.8"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
