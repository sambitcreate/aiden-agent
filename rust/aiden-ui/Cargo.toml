[package]
name = "aiden-ui"
description = "Aiden Agent GPUI application shell (port of renderer/** + main/windows/)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aiden"
path = "src/main.rs"

[features]
default = ["dictation"]
# On-device dictation (aiden-mac sherpa + model management). Keep in sync
# with aiden-mac's `dictation` feature.
dictation = ["aiden-mac/dictation"]

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui-tokio-bridge.workspace = true
aiden-core.workspace = true
aiden-data.workspace = true
aiden-git.workspace = true
aiden-mcp.workspace = true
aiden-providers.workspace = true
aiden-agent.workspace = true
aiden-subagents.workspace = true
aiden-mac.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-compat.workspace = true
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
chrono.workspace = true
url = "2"
alacritty_terminal = "0.26"
portable-pty = "0.9"

[dev-dependencies]
tempfile.workspace = true
