name: Studio diagnostics (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/studio-diagnostics.yml

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, macOS, ARM64, aiden-studio]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.4
          cache: npm
      - name: Host facts
        run: |
          sw_vers; uname -a; id; echo "PATH=$PATH"; echo "TMPDIR=$TMPDIR"
          which -a openssl; openssl version
          /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate || true
          /usr/libexec/ApplicationFirewall/socketfilterfw --getstealthmode || true
          launchctl managername || true
          mdutil -s "$RUNNER_TEMP" "$TMPDIR" 2>&1 || true
          sysctl -n hw.ncpu hw.memsize; vm_stat | head -5
      - run: npm ci
      - run: npx playwright install chromium
      - name: Chromium launch probe
        run: |
          (for i in 1 2 3 4 5 6; do screencapture -x "$RUNNER_TEMP/screen-$i.png" 2>/dev/null; sleep 5; done) &
          DEBUG=pw:browser* timeout 60 npx tsx --test --test-name-pattern="boxes match" main/services/browser/credential-fields.test.ts 2>&1 | tail -80 || true
          wait
      - name: Subagent tests alone on an idle machine
        run: |
          npm run build:lease-flock && npm run build:subagent-run-store && npm run build:worktree-file-io
          npm run build:subagent-file-mutator && node scripts/build-subagent-file-mutator.mjs --test
          npm run build:subagent-shell-runner && node scripts/build-subagent-shell-runner.mjs --test
          for i in 1 2; do
            npx tsx --test main/services/subagents/subagent-file-mutator-io.test.ts main/services/subagents/subagent-workspace-write.test.ts main/services/subagents/subagent-shell-runner-io.test.ts 2>&1 | grep -E "^(not ok|# (pass|fail))|Error|preserved" | head -40 || true
          done
      - name: Fresh temp file metadata
        run: |
          d=$(mktemp -d); f="$d/probe.txt"
          node -e 'require("fs").writeFileSync(process.argv[1], "a")' "$f"
          ls -lO@e "$f"; xattr -l "$f"; stat -f '%i %m %c %B %f' "$f"
          sleep 3
          ls -lO@e "$f"; xattr -l "$f"; stat -f '%i %m %c %B %f' "$f"
          node -e 'const fs=require("fs");fs.renameSync(process.argv[1], process.argv[1]+".2")' "$f"
          ls -lO@e "$f.2"; xattr -l "$f.2"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: studio-screens
          path: ${{ runner.temp }}/screen-*.png
          if-no-files-found: ignore
          retention-days: 3
