# Pullfrog action and source runtime are reviewed and pinned together.
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          ref: main
          persist-credentials: false
      - name: Use pinned Node with Corepack
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.4
      - name: Verify locked-runtime bootstrap
        run: corepack --version
      - name: Load reviewed runtime bootstrap
        id: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_BLOB: "abdf127c8414de0683857dd81987826c1d402a14"
          BOOTSTRAP_SHA256: "635a55799a0f662c75eed3c1a9d6f0b1a64c89862f5d6293c05c228c41f37c84"
        shell: bash
        run: |
          python3 - <<'PYBOOT'
          import base64, hashlib, json, os, subprocess
          result = json.loads(subprocess.check_output([
              "gh", "api", "--hostname", "github.com",
              "repos/sambitcreate/aiden-agent/git/blobs/" + os.environ["BOOTSTRAP_BLOB"],
          ], text=True))
          if result.get("encoding") != "base64" or result.get("size", 0) > 65536:
              raise SystemExit("Invalid bootstrap blob")
          content = base64.b64decode("".join(result["content"].split()), validate=True)
          if hashlib.sha256(content).hexdigest() != os.environ["BOOTSTRAP_SHA256"]:
              raise SystemExit("Bootstrap integrity mismatch")
          url = "data:text/javascript;base64," + base64.b64encode(content).decode("ascii")
          print("::add-mask::" + url)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("node_options=--import=" + url + "\n")
          PYBOOT
      - name: Run agent
        # v0.1.57. The supported local mode runs this commit's cli.ts with its
        # frozen pnpm lock; the default launcher resolves a caret npm range.
        uses: pullfrog/pullfrog@0657d542f2e34565c6254d5c84581313e631cd90
        with:
          prompt: ${{ inputs.prompt }}
          # Aggregate release PRs can span many independently reviewed changes.
          # Keep enough time for the final cross-change review to complete.
          timeout: 2h
        env:
          PULLFROG_FORCE_LOCAL_CLI: "1"
          NODE_OPTIONS: ${{ steps.bootstrap.outputs.node_options }}
          # Optional provider bindings support remotely selected review models.
          # Inventory names only; never print values or infer use from presence.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY:
            ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          
          # for Amazon Bedrock (https://docs.pullfrog.com/bedrock)
          # AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # AWS_REGION: us-east-1
          # BEDROCK_MODEL_ID: <bedrock-model-id>
          
          # for Google Vertex AI (https://docs.pullfrog.com/vertex)
          # VERTEX_SERVICE_ACCOUNT_JSON: >-
          #   ${{ secrets.VERTEX_SERVICE_ACCOUNT_JSON }}
          # GOOGLE_CLOUD_PROJECT: my-project
          # VERTEX_LOCATION: global
          # VERTEX_MODEL_ID: <vertex-model-id>
