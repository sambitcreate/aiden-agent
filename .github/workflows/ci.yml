name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Detect Android changes
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          diff_args=("$BASE_SHA" "$HEAD_SHA")
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            diff_args=("$BASE_SHA...$HEAD_SHA")
          fi

          if ! changed_files="$(git diff --name-only "${diff_args[@]}")"; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -E '^(android(/|$)|\.github/workflows/ci\.yml$)' <<< "$changed_files" >/dev/null; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium for Generative UI containment
        run: npx playwright install chromium

      - name: Verify TypeScript
        run: npm run type-check

      - name: Verify lint
        run: npm run lint

      - name: Verify diagnostics privacy and storage contracts
        run: npm run test:diagnostics

      - name: Verify branding, updater, and release policy
        run: npm run test:branding

      - name: Verify model catalog contracts
        run: npm run test:model-catalog

      - name: Run JavaScript, TypeScript, and Computer Use tests
        env:
          AIDEN_SKIP_VIRTUALIZED_LAUNCH_CONSTRAINT_TESTS: "1"
        run: npm test

      - name: Run Apple Foundation Models tests
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: npm run test:native

      # The owner requires physical-device-only XCTest acceptance. Hosted CI has
      # no physical iOS device, so compile the app and test bundle for generic
      # hardware here; the complete XCTest suite is recorded from signed devices.
      - name: Compile Aiden On The Go tests for generic iOS hardware
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: >-
          xcodebuild build-for-testing -quiet
          -project ios/AidenOnTheGo.xcodeproj
          -scheme AidenOnTheGo
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath '${{ runner.temp }}/AidenOnTheGoDerivedData'
          CODE_SIGNING_ALLOWED=NO

      - name: Build production bundles
        run: npm run build

      - name: Verify production-profile diagnostics support workflow
        run: npm run test:e2e:diagnostics:production

  android:
    name: Android build and APK
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Enable Android emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK and test image
        run: >-
          sdkmanager
          "platforms;android-36"
          "build-tools;36.0.0"
          "emulator"
          "system-images;android-36;google_apis;x86_64"

      - name: Verify Android and assemble debug APK
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:compileDebugAndroidTestKotlin
          --stacktrace

      - name: Run Android Compose UI tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          working-directory: ./android
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Record APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aiden-on-the-go-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Deterministic Electron E2E
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run deterministic Electron E2E gate
        run: npm run test:e2e

      - name: Build sanitized E2E failure receipt
        if: ${{ failure() }}
        run: npm run diagnostics:failure-receipt -- test-results/e2e-safe-receipt.json electron-e2e test-failed

      - name: Upload sanitized E2E failure receipt
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-e2e-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/e2e-safe-receipt.json
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install --yes rpm xvfb

      - name: Install locked dependencies
        run: npm ci

      - name: Verify TypeScript and lint
        run: npm run type-check && npm run lint

      - name: Run Pi extension, Linux contract, and native helper tests
        run: npm run test:pi-extensions && npm run test:linux-contracts && npm run test:linux-native

      - name: Build, install, and verify Linux distributions
        run: |
          set -euo pipefail
          npm run dist:linux
          node scripts/verify-linux-package.mjs release/linux-distribution
          sudo apt-get install --yes ./release/linux-distribution/*.deb
          dpkg --verify aiden-agent
          ! ldd "/opt/Aiden Agent/aiden-agent" | grep -q "not found"
          test -f /usr/share/applications/com.sambitcreate.aiden-agent.desktop
          grep -F 'StartupWMClass=com.sambitcreate.aiden-agent' /usr/share/applications/com.sambitcreate.aiden-agent.desktop
          expected_version="$(node -p 'require("./package.json").version')"
          test "$(aiden-agent --no-sandbox --version)" = "$expected_version"
          chmod +x ./release/linux-distribution/*.AppImage
          appimage_output="$(./release/linux-distribution/*.AppImage --appimage-extract-and-run --no-sandbox --version)"
          grep -F "$expected_version" <<<"$appimage_output"

      - name: Smoke the installed GUI without a keyring session
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/aiden-linux-smoke-${{ matrix.arch }}"
          mkdir -p "$smoke_root/home" "$smoke_root/config" "$smoke_root/cache" "$smoke_root/data"
          set +e
          HOME="$smoke_root/home" \
          XDG_CONFIG_HOME="$smoke_root/config" \
          XDG_CACHE_HOME="$smoke_root/cache" \
          XDG_DATA_HOME="$smoke_root/data" \
            timeout --kill-after=5s 15s xvfb-run --auto-servernum aiden-agent --no-sandbox \
              >"$smoke_root/output.log" 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 124 ]]; then
            cat "$smoke_root/output.log"
            exit 1
          fi
          if grep -Eiq '(FATAL|symbol lookup error|error while loading shared libraries|Failed to start Aiden Agent)' "$smoke_root/output.log"; then
            cat "$smoke_root/output.log"
            exit 1
          fi

      - name: Run deterministic Electron E2E gate
        if: matrix.arch == 'x64'
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Build sanitized E2E failure receipt
        if: ${{ failure() && matrix.arch == 'x64' }}
        run: npm run diagnostics:failure-receipt -- test-results/e2e-safe-receipt.json electron-e2e test-failed

      - name: Upload sanitized E2E failure receipt
        if: ${{ failure() && matrix.arch == 'x64' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-e2e-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/e2e-safe-receipt.json
          if-no-files-found: error
          retention-days: 7

  linux-rpm:
    name: Linux x64 · Fedora RPM
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 60
    steps:
      - name: Install Fedora build prerequisites
        run: dnf install --assumeyes git gcc gcc-c++ make python3 rpm-build

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Fedora Pi extensions, contracts, and native helpers
        run: npm run type-check && npm run test:pi-extensions && npm run test:linux-contracts && npm run test:linux-native

      - name: Build, install, and verify RPM package
        run: |
          set -euo pipefail
          npm run build
          npx electron-builder --linux rpm --config.forceCodeSigning=false --config.directories.output=release/linux-rpm-smoke --publish never
          node scripts/verify-linux-package.mjs release/linux-rpm-smoke
          dnf install --assumeyes ./release/linux-rpm-smoke/*.rpm
          rpm_verify_output="$(rpm --verify aiden-agent || true)"
          if [ -n "$rpm_verify_output" ]; then
            # electron-builder deliberately enables its setuid fallback when
            # user namespaces do not work (including containerized CI). Keep
            # every other RPM integrity difference fatal and prove the exact
            # privileged file owner/mode before accepting that one transition.
            test "$rpm_verify_output" = '.M.......    /opt/Aiden Agent/chrome-sandbox'
            test "$(stat -c '%a:%U:%G' '/opt/Aiden Agent/chrome-sandbox')" = '4755:root:root'
          fi
          ! ldd "/opt/Aiden Agent/aiden-agent" | grep -q "not found"
          expected_version="$(node -p 'require("./package.json").version')"
          test "$(aiden-agent --no-sandbox --version)" = "$expected_version"
