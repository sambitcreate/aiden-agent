name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Detect Android changes
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          diff_args=("$BASE_SHA" "$HEAD_SHA")
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            diff_args=("$BASE_SHA...$HEAD_SHA")
          fi

          if ! changed_files="$(git diff --name-only "${diff_args[@]}")"; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -E '^(android(/|$)|\.github/workflows/ci\.yml$)' <<< "$changed_files" >/dev/null; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium for Generative UI containment
        run: npx playwright install chromium

      - name: Verify TypeScript
        run: npm run type-check

      - name: Verify lint
        run: npm run lint

      - name: Verify branding, updater, and release policy
        run: npm run test:branding

      - name: Run JavaScript, TypeScript, and Computer Use tests
        env:
          AIDEN_SKIP_VIRTUALIZED_LAUNCH_CONSTRAINT_TESTS: "1"
        run: npm test

      - name: Run Apple Foundation Models tests
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: npm run test:native

      # The owner requires physical-device-only XCTest acceptance. Hosted CI has
      # no physical iOS device, so compile the app and test bundle for generic
      # hardware here; the complete XCTest suite is recorded from signed devices.
      - name: Compile Aiden On The Go tests for generic iOS hardware
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: >-
          xcodebuild build-for-testing -quiet
          -project ios/AidenOnTheGo.xcodeproj
          -scheme AidenOnTheGo
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath '${{ runner.temp }}/AidenOnTheGoDerivedData'
          CODE_SIGNING_ALLOWED=NO

      - name: Build production bundles
        run: npm run build

  android:
    name: Android build and APK
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Enable Android emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK and test image
        run: >-
          sdkmanager
          "platforms;android-36"
          "build-tools;36.0.0"
          "emulator"
          "system-images;android-36;google_apis;x86_64"

      - name: Verify Android and assemble debug APK
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:compileDebugAndroidTestKotlin
          --stacktrace

      - name: Run Android Compose UI tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          working-directory: ./android
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Record APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aiden-on-the-go-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Deterministic Electron E2E
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run deterministic Electron E2E gate
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-e2e-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/e2e
            playwright-report/e2e
          if-no-files-found: warn
          retention-days: 14
