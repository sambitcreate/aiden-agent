name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npm run type-check

      - name: Verify lint
        run: npm run lint

      - name: Verify branding, updater, and release policy
        run: npm run test:branding

      - name: Run JavaScript, TypeScript, and Computer Use tests
        env:
          AIDEN_SKIP_VIRTUALIZED_LAUNCH_CONSTRAINT_TESTS: "1"
        run: npm test

      - name: Run Apple Foundation Models tests
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: npm run test:native

      - name: Build production bundles
        run: npm run build

      - name: Package and enforce the real app payload budget
        run: npm run package

      - name: Verify the packaged app and package budget
        run: npm run package:verify
