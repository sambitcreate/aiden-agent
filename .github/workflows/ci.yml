name: Prepare unsigned iOS hotfix archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    name: Archive merged iOS fix without credentials
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out the exact merged fix
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 1f9f466f8dfa6589f081c5177500fde0777ee7e4
          fetch-depth: 0
          persist-credentials: false
      - name: Verify provenance and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1f9f466f8dfa6589f081c5177500fde0777ee7e4"
          git merge-base --is-ancestor HEAD origin/main
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Archive Release without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive -quiet \
            -project ios/AidenOnTheGo.xcodeproj \
            -scheme AidenOnTheGo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AidenOnTheGo.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/AidenArchiveDerivedData" \
            CURRENT_PROJECT_VERSION=41 \
            DEVELOPMENT_TEAM=5WP229CBB8 \
            CODE_SIGNING_ALLOWED=NO
      - name: Package archive and source proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aiden-unsigned-41"
          python3 - <<'PYTHON'
          import json, os, pathlib, plistlib, subprocess
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'aiden-unsigned-41'
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'AidenOnTheGo.xcarchive'
          app = archive / 'Products/Applications/AidenOnTheGo.app'
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'sbtbiswas.AidenOnTheGo'
          assert info['CFBundleShortVersionString'] == '0.1.0'
          assert info['CFBundleVersion'] == '41'
          proof = {'sourceCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                   'sourceTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                   'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
                   'bundleId': info['CFBundleIdentifier'], 'version': info['CFBundleShortVersionString'],
                   'build': info['CFBundleVersion'], 'sdkName': info.get('DTSDKName'),
                   'sdkBuild': info.get('DTSDKBuild'), 'xcodeBuild': info.get('DTXcodeBuild')}
          (output / 'source-provenance.json').write_text(json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof, indent=2))
          PYTHON
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/aiden-unsigned-41/AidenOnTheGo.xcarchive.tar.gz" AidenOnTheGo.xcarchive
          shasum -a 256 "$RUNNER_TEMP/aiden-unsigned-41/AidenOnTheGo.xcarchive.tar.gz" > "$RUNNER_TEMP/aiden-unsigned-41/archive.sha256"
      - name: Save unsigned archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aiden-unsigned-41
          path: ${{ runner.temp }}/aiden-unsigned-41/
          retention-days: 1
          if-no-files-found: error
