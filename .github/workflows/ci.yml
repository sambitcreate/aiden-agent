name: CI

on:
  pull_request:
  # Started by model-catalog-main-baseline.yml after a catalog merge, which
  # (made with the job token) produces no push event of its own.
  workflow_dispatch:
  push:
    branches:
      - main
      # The model catalog bot pushes here with its deploy key; a pull request it
      # opens with the job token would not start CI on its own.
      - "automation/models-dev-catalog-*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      apple: ${{ steps.filter.outputs.apple }}
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
      cli: ${{ steps.filter.outputs.cli }}
      linux: ${{ steps.filter.outputs.linux }}
      catalog: ${{ steps.filter.outputs.catalog }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
      - name: Detect shared and platform changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_FULL: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: node scripts/ci-changes.mjs

  policy:
    name: CI policy and test inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify workflow policy and complete test assignment
        run: npm run test:ci-policy

  # One macOS production build feeds the E2E shards and desktop verification.
  # The tarball keeps the native helpers' executable modes, which the artifact
  # zip format drops. The E2E type check runs in the static job.
  build:
    name: Desktop production build
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build production bundles once
        run: npm run build
      - name: Check main-window initial JS budget
        run: npm run check:bundle-budget
      - name: Package production bundles and native helpers
        run: tar -cf "$RUNNER_TEMP/desktop-build.tar" build
      - name: Upload production build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-build.tar
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Electron E2E (${{ matrix.shard }}/3)
    needs: [changes, build]
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Download production build
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: desktop-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-build
      - name: Restore production build
        run: tar -xf "$RUNNER_TEMP/desktop-build/desktop-build.tar"
      - name: Run deterministic Electron E2E shard
        run: node scripts/ci-e2e-shards.mjs ${{ matrix.shard }}/3
      - name: Build sanitized E2E failure receipt
        if: ${{ failure() }}
        run: npm run diagnostics:failure-receipt -- test-results/e2e-safe-receipt.json electron-e2e test-failed
      - name: Upload sanitized E2E failure receipt
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-e2e-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/e2e-safe-receipt.json
          if-no-files-found: error
          retention-days: 7

  static:
    name: Desktop TypeScript and lint
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' || needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify TypeScript
        run: npm run type-check && npm run type-check:e2e
      - name: Verify lint
        run: npm run lint

  verify:
    name: Desktop build and diagnostics
    needs: [changes, build]
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify diagnostics privacy and storage contracts
        run: npm run test:diagnostics
      - name: Verify branding, updater, and release policy
        run: npm run test:branding
      - name: Download production build
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: desktop-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-build
      - name: Restore production build
        run: tar -xf "$RUNNER_TEMP/desktop-build/desktop-build.tar"
      - name: Verify foreground file tools in pinned Electron
        run: npm run test:foreground-file-tools:electron
      - name: Verify production-profile diagnostics support workflow
        run: npm run test:e2e:diagnostics:production:run

  # Desktop selections imply this job. A main push that changes only the bundled
  # models.dev catalog runs nothing else.
  catalog:
    name: Model catalog contracts
    needs: changes
    if: ${{ needs.changes.outputs.catalog == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify model catalog contracts
        run: npm run test:model-catalog

  unit:
    name: Desktop tests (${{ matrix.lane }})
    needs: changes
    # Catalog refreshes run these too: the runtime takes model limits from it.
    if: ${{ needs.changes.outputs.desktop == 'true' || needs.changes.outputs.catalog == 'true' }}
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [core-git, runtime-subagents, renderer-other]
        include:
          - lane: core-git
            chromium: true
          - lane: renderer-other
            chromium: true
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright Chromium for containment
        if: ${{ matrix.chromium == true }}
        run: npx playwright install chromium
      - name: Run assigned regression tests and prerequisites
        env:
          AIDEN_SKIP_VIRTUALIZED_LAUNCH_CONSTRAINT_TESTS: "1"
        run: node scripts/run-ci-tests.mjs --lane ${{ matrix.lane }} --summary

  apple:
    name: Apple Foundation Models tests
    needs: changes
    if: ${{ needs.changes.outputs.apple == 'true' }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
      - name: Run Apple Foundation Models tests
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: npm run test:native

  # One macOS job compiles for device hardware, then builds the simulator tests
  # once and runs them without rebuilding. Hosted simulator XCTest is
  # regression evidence only; physical-device acceptance (ios/AGENTS.md) still
  # runs separately on real hardware.
  ios:
    name: iOS build and simulator tests
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: macos-26
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22 for iOS-only policy checks
        if: ${{ needs.changes.outputs.desktop == 'false' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install iOS policy dependencies
        if: ${{ needs.changes.outputs.desktop == 'false' }}
        run: npm ci
      - name: Verify iOS shipping and TestFlight policies
        if: ${{ needs.changes.outputs.desktop == 'false' }}
        run: npm run test:ios-release
      # Only the resolved Swift package checkouts are cached. Build products
      # stay uncached because a fresh checkout invalidates them anyway.
      - name: Restore Swift package checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/AidenOnTheGoSourcePackages
          key: ios-spm-xcode-26.6-${{ hashFiles('ios/AidenOnTheGo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Compile Aiden On The Go tests for generic iOS hardware
        run: >-
          xcodebuild build-for-testing -quiet
          -project ios/AidenOnTheGo.xcodeproj
          -scheme AidenOnTheGo
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath '${{ runner.temp }}/AidenOnTheGoDerivedData'
          -clonedSourcePackagesDirPath '${{ runner.temp }}/AidenOnTheGoSourcePackages'
          CODE_SIGNING_ALLOWED=NO
      - name: Select the newest available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin)["devices"]
          def version(key):
              return [int(part) for part in re.findall(r"\d+", key.rsplit(".", 1)[-1])]
          for key in sorted((k for k in runtimes if ".SimRuntime.iOS-" in k), key=version, reverse=True):
              phones = [d for d in runtimes[key] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"])
                  break
          ')"
          if [[ -z "$udid" ]]; then
            echo "No available iPhone simulator on this runner." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build Aiden On The Go tests for the simulator
        run: >-
          xcodebuild build-for-testing -quiet
          -project ios/AidenOnTheGo.xcodeproj
          -scheme AidenOnTheGo
          -configuration Debug
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          -derivedDataPath '${{ runner.temp }}/AidenOnTheGoDerivedData'
          -clonedSourcePackagesDirPath '${{ runner.temp }}/AidenOnTheGoSourcePackages'
          CODE_SIGNING_ALLOWED=NO
      - name: Run Aiden On The Go XCTest on the simulator
        run: >-
          xcodebuild test-without-building -quiet
          -project ios/AidenOnTheGo.xcodeproj
          -scheme AidenOnTheGo
          -configuration Debug
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          -derivedDataPath '${{ runner.temp }}/AidenOnTheGoDerivedData'
          -clonedSourcePackagesDirPath '${{ runner.temp }}/AidenOnTheGoSourcePackages'
          -resultBundlePath '${{ runner.temp }}/AidenOnTheGoSimulator.xcresult'
          CODE_SIGNING_ALLOWED=NO

      - name: Preserve failed iOS simulator test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-simulator-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/AidenOnTheGoSimulator.xcresult
          retention-days: 7
          if-no-files-found: warn

  android:
    name: Android build and APK
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Enable Android emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK and test image
        run: >-
          sdkmanager
          "platforms;android-36"
          "build-tools;36.0.0"
          "emulator"
          "system-images;android-36;google_apis;x86_64"

      - name: Verify Android
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:compileDebugAndroidTestKotlin
          --build-cache
          --stacktrace

      - name: Run Android Compose UI tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          working-directory: ./android
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --build-cache --stacktrace

      - name: Assemble installable debug APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: ./gradlew :app:assembleDebug --build-cache --stacktrace

      - name: Record APK checksum
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload installable debug APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aiden-on-the-go-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  cli-linux:
    name: Headless CLI on Linux
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build and test the headless container
        run: docker build -f packages/cli/Dockerfile -t aiden-cli:ci .
      - name: Verify the runtime image
        run: docker run --rm aiden-cli:ci --version

  cli-playground:
    name: CLI appearance playground
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: packages/cli-playground/package-lock.json
      - name: Install playground dependencies
        run: npm ci
        working-directory: packages/cli-playground
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/cli-playground
      - name: Build and test the playground
        run: npm run build && npm test
        working-directory: packages/cli-playground

  required:
    name: CI required
    if: ${{ always() }}
    needs: [changes, policy, static, build, verify, catalog, unit, e2e, apple, ios, android, cli-linux, cli-playground]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
      - name: Require every selected check to pass
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_CHANGES_JSON: ${{ toJSON(needs.changes.outputs) }}
        run: node scripts/ci-required.mjs

  timings:
    name: CI timing report
    needs: required
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
      - name: Summarize this CI attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-timings.mjs

  # Always expand the matrix so required contexts exist for scoped PRs too.
  # Both contexts fail closed if detection or any selected Linux build fails.
  linux-required:
    name: Linux ${{ matrix.arch }}
    if: ${{ always() }}
    needs: [changes, linux]
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selected Linux builds
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINUX_SELECTED: ${{ needs.changes.outputs.linux }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: |
          case "$CHANGES_RESULT:$LINUX_SELECTED:$LINUX_RESULT" in
            success:true:success|success:false:skipped) exit 0 ;;
            *) echo "Linux gate failed: $CHANGES_RESULT:$LINUX_SELECTED:$LINUX_RESULT"; exit 1 ;;
          esac

  # Linux packaging and its E2E gate run for Linux-relevant changes and on
  # every main push. linux-rpm skips with it.
  linux:
    name: Linux build ${{ matrix.arch }}
    needs: changes
    if: ${{ needs.changes.outputs.linux == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install --yes rpm xvfb pkg-config libsecret-1-dev libselinux1-dev gnome-keyring dbus-x11

      - name: Install locked dependencies
        run: npm ci

      - name: Verify TypeScript and lint
        run: npm run type-check && npm run lint

      - name: Run Pi extension, Linux contract, and native helper tests
        run: npm run test:pi-extensions && npm run test:linux-contracts && npm run test:linux-native

      - name: Verify Bot authority with an isolated persistent keyring
        run: npm run test:secret-service-integration

      - name: Build, install, and verify Linux distributions
        run: |
          set -euo pipefail
          npm run dist:linux
          node scripts/verify-linux-package.mjs release/linux-distribution
          node scripts/prepare-linux-update-feed.mjs release/linux-distribution "${{ matrix.arch }}" "$(node -p 'require("./package.json").version')"
          sudo apt-get install --yes ./release/linux-distribution/*.deb
          dpkg --verify aiden-agent
          ! ldd "/opt/Aiden Agent/aiden-agent" | grep -q "not found"
          test -f /usr/share/applications/com.sambitcreate.aiden-agent.desktop
          grep -F 'StartupWMClass=com.sambitcreate.aiden-agent' /usr/share/applications/com.sambitcreate.aiden-agent.desktop
          expected_version="$(node -p 'require("./package.json").version')"
          test "$(aiden-agent --no-sandbox --version)" = "$expected_version"
          chmod +x ./release/linux-distribution/*.AppImage
          appimage_output="$(./release/linux-distribution/*.AppImage --appimage-extract-and-run --no-sandbox --version)"
          grep -F "$expected_version" <<<"$appimage_output"

      - name: Prepare baseline-verified RPM for Fedora acceptance
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rpm_files=(release/linux-distribution/*.rpm)
          test "${#rpm_files[@]}" -eq 1
          rpm_name="$(basename "${rpm_files[0]}")"
          (
            cd release/linux-distribution
            sha256sum "$rpm_name" > rpm.sha256
          )

      - name: Upload baseline-verified RPM for Fedora acceptance
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-rpm-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/linux-distribution/*.rpm
            release/linux-distribution/rpm.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Smoke the installed GUI without a keyring session
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/aiden-linux-smoke-${{ matrix.arch }}"
          mkdir -p "$smoke_root/home" "$smoke_root/config" "$smoke_root/cache" "$smoke_root/data"
          set +e
          HOME="$smoke_root/home" \
          XDG_CONFIG_HOME="$smoke_root/config" \
          XDG_CACHE_HOME="$smoke_root/cache" \
          XDG_DATA_HOME="$smoke_root/data" \
            timeout --signal=KILL 15s xvfb-run --auto-servernum aiden-agent --no-sandbox \
              >"$smoke_root/output.log" 2>&1
          status=$?
          set -e
          # A living GUI is the success condition. Kill the whole timeout
          # process group instead of asking Electron to perform a production
          # shutdown inside an incomplete headless desktop session.
          if [[ "$status" -ne 137 ]]; then
            cat "$smoke_root/output.log"
            exit 1
          fi
          if grep -Eiq '(FATAL|symbol lookup error|error while loading shared libraries|Failed to start Aiden Agent)' "$smoke_root/output.log"; then
            cat "$smoke_root/output.log"
            exit 1
          fi

      - name: Run deterministic Electron E2E gate
        if: matrix.arch == 'x64'
        run: |
          set -euo pipefail
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor,
          # which leaves Electron with neither sandbox and makes it abort.
          # Re-enable the namespace sandbox at the runner level instead of
          # granting setuid-root to chrome-sandbox inside the PR-controlled
          # checkout, where untrusted install scripts could swap the target.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Namespace-sandboxed renderers stay dumpable (setuid-sandboxed ones
          # were not), so the specs' intentional renderer crashes would pipe
          # full cores to the image's apport handler. The renderer is not
          # reaped until the dump drains, which stalls crash detection past
          # the specs' timeouts. Intentional test crashes need no core files.
          echo "previous core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          sudo sysctl -w kernel.core_pattern=core
          ulimit -c 0
          xvfb-run --auto-servernum npm run test:e2e

      - name: Build sanitized E2E failure receipt
        if: ${{ failure() && matrix.arch == 'x64' }}
        run: npm run diagnostics:failure-receipt -- test-results/e2e-safe-receipt.json electron-e2e test-failed

      - name: Upload sanitized E2E failure receipt
        if: ${{ failure() && matrix.arch == 'x64' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-e2e-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/e2e-safe-receipt.json
          if-no-files-found: error
          retention-days: 7

  linux-rpm:
    name: Linux x64 · Fedora RPM
    needs: linux
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 60
    steps:
      - name: Install Fedora build prerequisites
        run: dnf install --assumeyes git gcc gcc-c++ make python3 pkgconf-pkg-config libsecret-devel libselinux-devel cargo rust dbus-daemon

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Fedora Pi extensions, contracts, and native helpers
        run: npm run type-check && npm run test:pi-extensions && npm run test:linux-contracts && npm run test:linux-native

      - name: Download baseline-verified RPM
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: linux-rpm-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/linux-rpm-smoke

      - name: Install and verify baseline-verified RPM package
        run: |
          set -euo pipefail
          shopt -s nullglob
          rpm_files=(release/linux-rpm-smoke/*.rpm)
          test "${#rpm_files[@]}" -eq 1
          (
            cd release/linux-rpm-smoke
            sha256sum --check rpm.sha256
          )
          expected_version="$(node -p 'require("./package.json").version')"
          test "$(rpm -qp --queryformat '%{NAME} %{VERSION} %{ARCH}' "${rpm_files[0]}")" = \
            "aiden-agent $expected_version x86_64"
          dnf install --assumeyes "${rpm_files[0]}"
          node scripts/verify-linux-package.mjs "/opt/Aiden Agent"
          rpm_verify_output="$(rpm --verify aiden-agent || true)"
          if [ -n "$rpm_verify_output" ]; then
            # electron-builder deliberately enables its setuid fallback when
            # user namespaces do not work (including containerized CI). Keep
            # every other RPM integrity difference fatal and prove the exact
            # privileged file owner/mode before accepting that one transition.
            test "$rpm_verify_output" = '.M.......    /opt/Aiden Agent/chrome-sandbox'
            test "$(stat -c '%a:%U:%G' '/opt/Aiden Agent/chrome-sandbox')" = '4755:root:root'
          fi
          ! ldd "/opt/Aiden Agent/aiden-agent" | grep -q "not found"
          test "$(aiden-agent --no-sandbox --version)" = "$expected_version"