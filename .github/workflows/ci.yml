name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npm run type-check

      - name: Verify lint
        run: npm run lint

      - name: Verify branding, updater, and release policy
        run: npm run test:branding

      - name: Run JavaScript, TypeScript, and Computer Use tests
        env:
          AIDEN_SKIP_VIRTUALIZED_LAUNCH_CONSTRAINT_TESTS: "1"
        run: npm test

      - name: Run Apple Foundation Models tests
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: npm run test:native

      # The owner requires physical-device-only XCTest acceptance. Hosted CI has
      # no physical iOS device, so compile the app and test bundle for generic
      # hardware here; the complete XCTest suite is recorded from signed devices.
      - name: Compile Aiden On The Go tests for generic iOS hardware
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: >-
          xcodebuild build-for-testing -quiet
          -project ios/AidenOnTheGo.xcodeproj
          -scheme AidenOnTheGo
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath '${{ runner.temp }}/AidenOnTheGoDerivedData'
          CODE_SIGNING_ALLOWED=NO

      - name: Build production bundles
        run: npm run build

  e2e:
    name: Deterministic Electron E2E
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run deterministic Electron E2E gate
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-e2e-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/e2e
            playwright-report/e2e
          if-no-files-found: warn
          retention-days: 14
