name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      apple: ${{ steps.filter.outputs.apple }}
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
      - name: Detect shared and platform changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_FULL: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: node scripts/ci-changes.mjs

  policy:
    name: CI policy and test inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify workflow policy and complete test assignment
        run: npm run test:ci-policy

  e2e:
    name: Electron E2E (${{ matrix.shard }}/3)
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare Electron E2E build
        run: npm run type-check:e2e && npm run build
      - name: Run deterministic Electron E2E shard
        run: node scripts/ci-e2e-shards.mjs ${{ matrix.shard }}/3
      - name: Build sanitized E2E failure receipt
        if: ${{ failure() }}
        run: npm run diagnostics:failure-receipt -- test-results/e2e-safe-receipt.json electron-e2e test-failed
      - name: Upload sanitized E2E failure receipt
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-e2e-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/e2e-safe-receipt.json
          if-no-files-found: error
          retention-days: 7

  static:
    name: Desktop TypeScript and lint
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify TypeScript
        run: npm run type-check && npm run type-check:e2e
      - name: Verify lint
        run: npm run lint

  verify:
    name: Desktop build and diagnostics
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify diagnostics privacy and storage contracts
        run: npm run test:diagnostics
      - name: Verify branding, updater, and release policy
        run: npm run test:branding
      - name: Verify model catalog contracts
        run: npm run test:model-catalog
      - name: Build production bundles once
        run: npm run build
      - name: Verify production-profile diagnostics support workflow
        run: npm run test:e2e:diagnostics:production:run

  unit:
    name: Desktop tests (${{ matrix.lane }})
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [core-git, runtime-subagents, renderer-other]
        include:
          - lane: core-git
            chromium: true
          - lane: renderer-other
            chromium: true
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright Chromium for containment
        if: ${{ matrix.chromium == true }}
        run: npx playwright install chromium
      - name: Run assigned regression tests and prerequisites
        env:
          AIDEN_SKIP_VIRTUALIZED_LAUNCH_CONSTRAINT_TESTS: "1"
        run: node scripts/run-ci-tests.mjs --lane ${{ matrix.lane }} --summary

  apple:
    name: Apple Foundation Models tests
    needs: changes
    if: ${{ needs.changes.outputs.apple == 'true' }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
      - name: Run Apple Foundation Models tests
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: npm run test:native

  ios:
    name: iOS app and test compilation
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22 for iOS-only policy checks
        if: ${{ needs.changes.outputs.desktop == 'false' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install iOS policy dependencies
        if: ${{ needs.changes.outputs.desktop == 'false' }}
        run: npm ci
      - name: Verify iOS shipping and TestFlight policies
        if: ${{ needs.changes.outputs.desktop == 'false' }}
        run: npm run test:ios-release
      # Physical-device XCTest acceptance stays separate from hosted compilation.
      - name: Compile Aiden On The Go tests for generic iOS hardware
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: >-
          xcodebuild build-for-testing -quiet
          -project ios/AidenOnTheGo.xcodeproj
          -scheme AidenOnTheGo
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath '${{ runner.temp }}/AidenOnTheGoDerivedData'
          CODE_SIGNING_ALLOWED=NO

  android:
    name: Android build and APK
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Enable Android emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK and test image
        run: >-
          sdkmanager
          "platforms;android-36"
          "build-tools;36.0.0"
          "emulator"
          "system-images;android-36;google_apis;x86_64"

      - name: Verify Android
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:compileDebugAndroidTestKotlin
          --stacktrace

      - name: Run Android Compose UI tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          working-directory: ./android
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Assemble installable debug APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Record APK checksum
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload installable debug APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aiden-on-the-go-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  cli-linux:
    name: Headless CLI on Linux
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build and test the headless container
        run: docker build -f packages/cli/Dockerfile -t aiden-cli:ci .
      - name: Verify the runtime image
        run: docker run --rm aiden-cli:ci --version

  cli-playground:
    name: CLI appearance playground
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: packages/cli-playground/package-lock.json
      - name: Install playground dependencies
        run: npm ci
        working-directory: packages/cli-playground
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/cli-playground
      - name: Build and test the playground
        run: npm run build && npm test
        working-directory: packages/cli-playground

  required:
    name: CI required
    if: ${{ always() }}
    needs: [changes, policy, static, verify, unit, e2e, apple, ios, android, cli-linux, cli-playground]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
      - name: Require every selected check to pass
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_CHANGES_JSON: ${{ toJSON(needs.changes.outputs) }}
        run: node scripts/ci-required.mjs

  timings:
    name: CI timing report
    needs: required
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
      - name: Summarize this CI attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-timings.mjs
