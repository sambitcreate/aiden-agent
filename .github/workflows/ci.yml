name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npm run type-check

      - name: Verify lint
        run: npm run lint

      - name: Verify branding, updater, and release policy
        run: npm run test:branding

      - name: Run JavaScript, TypeScript, and Computer Use tests
        env:
          AIDEN_SKIP_VIRTUALIZED_LAUNCH_CONSTRAINT_TESTS: "1"
        run: npm test

      - name: Run Apple Foundation Models tests
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: npm run test:native

      # The owner requires physical-device-only XCTest acceptance. Hosted CI has
      # no physical iOS device, so compile the app and test bundle for generic
      # hardware here; the complete XCTest suite is recorded from signed devices.
      - name: Compile Aiden On The Go tests for generic iOS hardware
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: >-
          xcodebuild build-for-testing -quiet
          -project ios/AidenOnTheGo.xcodeproj
          -scheme AidenOnTheGo
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath '${{ runner.temp }}/AidenOnTheGoDerivedData'
          CODE_SIGNING_ALLOWED=NO

      - name: Build production bundles
        run: npm run build

  android:
    name: Android build and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android SDK and test image
        run: >-
          sdkmanager
          "platforms;android-36"
          "build-tools;36.0.0"
          "emulator"
          "system-images;android-36;google_apis;x86_64"

      - name: Verify Android and assemble debug APK
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:compileDebugAndroidTestKotlin
          --stacktrace

      - name: Start Android test device
        shell: bash
        run: |
          printf 'no\n' | avdmanager create avd \
            --force \
            --name aiden-ci \
            --package 'system-images;android-36;google_apis;x86_64'
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd aiden-ci \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            >"$RUNNER_TEMP/aiden-emulator.log" 2>&1 &
          adb wait-for-device
          for attempt in {1..180}; do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == '1' ]]; then
              adb shell settings put global window_animation_scale 0
              adb shell settings put global transition_animation_scale 0
              adb shell settings put global animator_duration_scale 0
              exit 0
            fi
            sleep 2
          done
          sed -n '1,240p' "$RUNNER_TEMP/aiden-emulator.log"
          exit 1

      - name: Run Android Compose UI tests
        run: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Stop Android test device
        if: always()
        run: adb emu kill || true

      - name: Record APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aiden-on-the-go-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Deterministic Electron E2E
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run deterministic Electron E2E gate
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-e2e-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/e2e
            playwright-report/e2e
          if-no-files-found: warn
          retention-days: 14
