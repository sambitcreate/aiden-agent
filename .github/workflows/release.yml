name: Release macOS

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aiden-agent-macos-release
  cancel-in-progress: false

jobs:
  release:
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Assign the main-push version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(node scripts/prepare-ci-release.mjs "$GITHUB_RUN_NUMBER")"
          npm version "$release_version" --no-git-tag-version
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$release_version" >> "$GITHUB_OUTPUT"

      - name: Verify Homebrew and website release consumers
        run: npm run release:check-consumers

      - name: Verify TypeScript
        run: npm run type-check

      - name: Verify lint
        run: npm run lint

      - name: Verify branding, updater, and release policy
        run: npm run test:branding

      - name: Run JavaScript, TypeScript, and Computer Use tests
        env:
          AIDEN_SKIP_VIRTUALIZED_LAUNCH_CONSTRAINT_TESTS: "1"
        run: npm test

      - name: Run Apple Foundation Models tests
        run: npm run test:native

      - name: Run deterministic Electron E2E gate
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-e2e-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/e2e
            playwright-report/e2e
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare App Store Connect key
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_KEY_P8"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and verify distribution
        env:
          AIDEN_ENABLE_AUTO_UPDATES: "1"
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: npm run dist

      - name: Publish verified release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release or draft $RELEASE_TAG already exists; refusing to replace update assets." >&2
            exit 1
          fi
          cd release/distribution
          dmg_assets=( *.dmg )
          if [[ "${#dmg_assets[@]}" -ne 1 || ! -f "${dmg_assets[0]}" ]]; then
            echo "Expected exactly one verified versioned DMG before publishing." >&2
            exit 1
          fi
          website_dmg="$RUNNER_TEMP/Aiden-Agent-Beta-arm64.dmg"
          cp -- "${dmg_assets[0]}" "$website_dmg"
          shasum -a 256 -- *.dmg *.zip latest-mac.yml > SHA256SUMS
          website_sha256="$(shasum -a 256 -- "$website_dmg" | awk '{ print $1 }')"
          printf '%s  %s\n' "$website_sha256" "$(basename "$website_dmg")" >> SHA256SUMS
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Aiden Agent $RELEASE_VERSION" \
            --notes "Aiden Agent beta release. Changes since the previous release:" \
            --generate-notes \
            --draft \
            -- *.dmg *.zip latest-mac.yml SHA256SUMS "$website_dmg"
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
