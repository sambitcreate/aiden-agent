name: Release desktop

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aiden-agent-desktop-release
  cancel-in-progress: false

jobs:
  release:
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Assign the main-push version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(node scripts/prepare-ci-release.mjs "$GITHUB_RUN_NUMBER")"
          npm version "$release_version" --no-git-tag-version
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$release_version" >> "$GITHUB_OUTPUT"

      - name: Verify Homebrew and website release consumers
        run: npm run release:check-consumers

      - name: Verify TypeScript
        run: npm run type-check

      - name: Verify lint
        run: npm run lint

      - name: Verify branding, updater, and release policy
        run: npm run test:branding

      - name: Run JavaScript, TypeScript, and Computer Use tests
        env:
          AIDEN_SKIP_VIRTUALIZED_LAUNCH_CONSTRAINT_TESTS: "1"
        run: npm test

      - name: Run Apple Foundation Models tests
        run: npm run test:native

      - name: Run deterministic Electron E2E gate
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-e2e-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/e2e
            playwright-report/e2e
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare App Store Connect key
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_KEY_P8"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and verify distribution
        env:
          AIDEN_ENABLE_AUTO_UPDATES: "1"
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: npm run dist

      - name: Stage verified macOS release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-macos
          path: release/distribution
          if-no-files-found: error
          retention-days: 2

  linux-release:
    if: vars.RELEASES_ENABLED == 'true'
    name: Linux ${{ matrix.arch }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: release
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install Linux package dependencies
        run: sudo apt-get update && sudo apt-get install --yes rpm xvfb

      - name: Install locked dependencies
        run: npm ci

      - name: Assign the matching main-push version
        run: npm version "$(node scripts/prepare-ci-release.mjs "$GITHUB_RUN_NUMBER")" --no-git-tag-version

      - name: Verify Linux contracts and native helpers
        run: npm run type-check && npm run lint && npm run test:linux-contracts && npm run test:linux-native

      - name: Build and verify Linux distributions
        run: |
          set -euo pipefail
          npm run models:refresh
          npm run dist:linux
          node scripts/verify-linux-package.mjs release/linux-distribution
          sudo apt-get install --yes ./release/linux-distribution/*.deb
          dpkg --verify aiden-agent
          ! ldd "/opt/Aiden Agent/aiden-agent" | grep -q "not found"
          expected_version="$(node -p 'require("./package.json").version')"
          test "$(aiden-agent --no-sandbox --version)" = "$expected_version"
          chmod +x ./release/linux-distribution/*.AppImage
          appimage_output="$(./release/linux-distribution/*.AppImage --appimage-extract-and-run --no-sandbox --version)"
          grep -F "$expected_version" <<<"$appimage_output"

      - name: Smoke the exact release GUI without a keyring session
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/aiden-linux-release-smoke-${{ matrix.arch }}"
          mkdir -p "$smoke_root/home" "$smoke_root/config" "$smoke_root/cache" "$smoke_root/data"
          set +e
          HOME="$smoke_root/home" \
          XDG_CONFIG_HOME="$smoke_root/config" \
          XDG_CACHE_HOME="$smoke_root/cache" \
          XDG_DATA_HOME="$smoke_root/data" \
            timeout --kill-after=5s 15s xvfb-run --auto-servernum aiden-agent --no-sandbox \
              >"$smoke_root/output.log" 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 124 ]]; then
            cat "$smoke_root/output.log"
            exit 1
          fi
          if grep -Eiq '(FATAL|symbol lookup error|error while loading shared libraries|Failed to start Aiden Agent)' "$smoke_root/output.log"; then
            cat "$smoke_root/output.log"
            exit 1
          fi

      - name: Stage verified Linux release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            release/linux-distribution/*.AppImage
            release/linux-distribution/*.deb
            release/linux-distribution/*.rpm
          if-no-files-found: error
          retention-days: 2

  publish:
    if: vars.RELEASES_ENABLED == 'true'
    name: Publish verified desktop release
    needs:
      - release
      - linux-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3

      - name: Download verified desktop assets
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          pattern: release-*
          path: release/distribution
          merge-multiple: true

      - name: Resolve release identity
        id: version
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(node scripts/prepare-ci-release.mjs "$GITHUB_RUN_NUMBER")"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$release_version" >> "$GITHUB_OUTPUT"

      - name: Publish verified release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/publish-github-release.sh release/distribution
