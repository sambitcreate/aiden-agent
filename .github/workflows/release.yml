name: Release macOS

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact base-repository commit SHA to release after CI succeeds"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: aiden-agent-macos-release
  cancel-in-progress: false

jobs:
  admit:
    if: >-
      vars.RELEASES_ENABLED == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.status == 'completed' &&
          github.event.workflow_run.conclusion == 'success'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      source-sha: ${{ steps.admission.outputs.source-sha }}
      main-sha: ${{ steps.admission.outputs.main-sha }}
      ci-run-id: ${{ steps.admission.outputs.ci-run-id }}
      ci-required-job-id: ${{ steps.admission.outputs.ci-required-job-id }}
      admission-mode: ${{ steps.admission.outputs.admission-mode }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out trusted release admission source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false

      - name: Use Node.js 22 for release admission
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3

      - name: Admit exact CI source before allocating macOS
        id: admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || '' }}
        run: node scripts/ci-release-admission.mjs

      - name: Check out admitted source for release preflight
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.admission.outputs.source-sha }}

      - name: Resolve the declared release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(node -p "require('./package.json').version")"
          base_tag_match="$(git ls-remote --tags origin "refs/tags/v${base_version}")"
          base_tag_exists=false
          if [[ -n "$base_tag_match" ]]; then
            base_tag_exists=true
          fi
          selection="$(node scripts/prepare-ci-release.mjs "$base_tag_exists")"
          release_version="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).version)' "$selection")"
          release_tag="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).tag)' "$selection")"
          should_publish="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).publish))' "$selection")"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "publish=$should_publish" >> "$GITHUB_OUTPUT"
          if [[ "$should_publish" != true ]]; then
            echo "$release_tag already exists; skipping release without changing its version."
          fi

  release:
    if: vars.RELEASES_ENABLED == 'true' && needs.admit.result == 'success' && needs.admit.outputs.publish == 'true'
    needs: admit
    runs-on: macos-26
    timeout-minutes: 120
    environment: release
    permissions:
      actions: read
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.admit.outputs.source-sha }}

      - name: Confirm checkout matches admitted source
        env:
          ADMITTED_SOURCE_SHA: ${{ needs.admit.outputs.source-sha }}
        run: test "$(git rev-parse HEAD)" = "$ADMITTED_SOURCE_SHA"

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Homebrew and website release consumers
        run: npm run release:check-consumers

      - name: Prepare App Store Connect key
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_KEY_P8"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and verify distribution
        env:
          AIDEN_ENABLE_AUTO_UPDATES: "1"
          ADMITTED_SOURCE_SHA: ${{ needs.admit.outputs.source-sha }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: GITHUB_SHA="$ADMITTED_SOURCE_SHA" npm run dist

      - name: Verify reboot-safe subagent migration in the signed app
        run: npm run test:subagents:migration:packaged

      - name: Verify diagnostics in the signed packaged app
        run: npm run test:e2e:diagnostics:packaged

      - name: Build sanitized packaged acceptance failure receipt
        if: ${{ failure() }}
        run: npm run diagnostics:failure-receipt -- test-results/e2e-safe-receipt.json release test-failed

      - name: Upload sanitized packaged acceptance failure receipt
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packaged-diagnostics-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/e2e-safe-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Recheck admitted CI status before publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.admit.outputs.source-sha }}
        run: node scripts/ci-release-admission.mjs

      - name: Confirm main has not advanced since admission
        env:
          ADMITTED_MAIN_SHA: ${{ needs.admit.outputs.main-sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')"
          test -n "$current_main_sha"
          test "$current_main_sha" = "$ADMITTED_MAIN_SHA"

      - name: Publish verified release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ADMITTED_SOURCE_SHA: ${{ needs.admit.outputs.source-sha }}
          RELEASE_TAG: ${{ needs.admit.outputs.tag }}
          RELEASE_VERSION: ${{ needs.admit.outputs.version }}
        run: |
          set -euo pipefail
          GITHUB_SHA="$ADMITTED_SOURCE_SHA" bash scripts/publish-github-release.sh release/distribution
