name: Model catalog main baseline

# A catalog pull request is merged by auto-merge that the job token turned on,
# and GitHub starts no workflows for pushes made that way. This workflow makes
# sure main still gets a CI run of its own after every catalog merge: when CI
# passes on a catalog branch it waits briefly for the merge, and a schedule
# catches merges that land later. Either way it starts full CI on main unless a
# recent main CI run already tested a commit that contains the catalog merge.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: model-catalog-main-baseline
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event_name == 'schedule' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'automation/models-dev-catalog-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Job permissions replace the workflow's, so contents: read is restated for
    # the compare API.
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Run CI on main after the latest catalog merge
        shell: bash
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          merge_sha=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            # Fast path: auto-merge usually lands shortly after the checks pass.
            for _ in $(seq 1 60); do
              pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state all --limit 1 --json state,mergeCommit \
                --jq '.[0] // {} | "\(.state // "") \(.mergeCommit.oid // "")"')"
              state="${pr%% *}"
              if [[ "$state" == "MERGED" ]]; then merge_sha="${pr#* }"; break; fi
              [[ "$state" == "OPEN" ]] || break
              sleep 15
            done
          fi
          if [[ -z "$merge_sha" ]]; then
            # Catalog PRs share one title; a merge updates the PR, so the latest
            # catalog merge is among the most recently updated ones.
            merge_sha="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --limit 20 \
              --search 'in:title "chore: refresh models.dev catalog" sort:updated-desc' \
              --json headRefName,mergedAt,mergeCommit \
              --jq '[.[] | select(.headRefName | startswith("automation/models-dev-catalog-"))] | max_by(.mergedAt) | .mergeCommit.oid // ""')"
          fi
          if [[ -z "$merge_sha" ]]; then
            echo "No merged catalog pull request to cover."
            exit 0
          fi
          # Covered only if a recent main CI run tested a commit that contains the
          # merge; run creation order alone proves nothing. A compare failure fails
          # this job rather than dispatching, so it can never start CI every run.
          for run_sha in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --limit 10 --json headSha --jq '.[].headSha'); do
            if ! status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$merge_sha...$run_sha" --jq .status)"; then
              echo "Could not compare $merge_sha with $run_sha; not dispatching." >&2
              exit 1
            fi
            if [[ "$status" == "identical" || "$status" == "ahead" ]]; then
              echo "Main CI already ran on $run_sha, which contains catalog merge $merge_sha."
              exit 0
            fi
          done
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Started CI on main to cover catalog merge $merge_sha."
