name: Model catalog main baseline

# A catalog pull request is merged by auto-merge that the job token turned on,
# and GitHub starts no workflows for pushes made that way. Once CI passes on a
# catalog branch, wait for its pull request to merge and run full CI on main,
# so main keeps a CI run of its own after every catalog refresh.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'automation/models-dev-catalog-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Run CI on main once the catalog pull request merges
        shell: bash
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Auto-merge lands shortly after the required checks pass.
          for _ in $(seq 1 60); do
            state="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state all --limit 1 --json state --jq '.[0].state // ""')"
            case "$state" in
              MERGED)
                gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
                echo "Started CI on main after merging $BRANCH."
                exit 0
                ;;
              CLOSED)
                echo "$BRANCH was closed without merging; main is unchanged."
                exit 0
                ;;
            esac
            sleep 15
          done
          echo "$BRANCH did not merge within 15 minutes; the next push to main runs CI." >&2
