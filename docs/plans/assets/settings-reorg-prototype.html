<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aiden Settings Prototype</title>
    <!--
      Standalone design prototype for docs/plans/settings-reorg-and-info-hints-plan.md.
      It shows structure and copy. All names, models and counts are sample data, and
      nothing here saves or connects. Where it disagrees with the plan, the plan wins.
    -->
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        --bg: #f4f4f3;
        --sidebar-bg: #ececeb;
        --surface: #ffffff;
        --surface-popover: #ffffff;
        --surface-well: color-mix(in srgb, #ffffff 78%, #efefed);
        --control: rgb(0 0 0 / 0.065);
        --control-hover: rgb(0 0 0 / 0.105);
        --control-active: rgb(0 0 0 / 0.15);
        --list-hover: rgb(0 0 0 / 0.05);
        --list-selection: rgb(0 0 0 / 0.09);
        --separator: rgb(0 0 0 / 0.085);
        --text-primary: #181817;
        --text-secondary: rgb(24 24 23 / 0.62);
        --text-tertiary: rgb(24 24 23 / 0.5);
        --accent: #0b7de5;
        --accent-hover: #0873d5;
        --on-accent: #ffffff;
        --danger: #c3322b;
        --danger-surface: rgb(195 50 43 / 0.12);
        --green: #087c58;
        --green-surface: rgb(8 124 88 / 0.12);
        --warning: #8a5c00;
        --warning-surface: rgb(154 103 0 / 0.13);
        --blue-surface: rgb(11 125 229 / 0.12);
        --radius-card: 12px;
        --radius-button: 16px;
        --radius-control: 12px;
        --radius-menu: 8px;
        --radius-popover: 12px;
        --motion-duration: 200ms;
        --motion-easing: cubic-bezier(0.16, 1, 0.3, 1);
        --motion-popup-scale: 0.96;
        --shadow-hairline: 0 0 0 0.5px rgb(0 0 0 / 0.09);
        --shadow-card: var(--shadow-hairline), 0 1px 3px rgb(0 0 0 / 0.04);
        --shadow-popover: var(--shadow-hairline), 0 10px 28px -4px rgb(0 0 0 / 0.16), 0 2px 6px rgb(0 0 0 / 0.06);
        --focus-ring: var(--text-primary);
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #141413;
        --sidebar-bg: #10100f;
        --surface: #1c1c1b;
        --surface-popover: #242422;
        --surface-well: #1d1d1b;
        --control: rgb(255 255 255 / 0.085);
        --control-hover: rgb(255 255 255 / 0.13);
        --control-active: rgb(255 255 255 / 0.18);
        --list-hover: rgb(255 255 255 / 0.055);
        --list-selection: rgb(255 255 255 / 0.11);
        --separator: rgb(255 255 255 / 0.085);
        --text-primary: #f5f5f3;
        --text-secondary: rgb(245 245 243 / 0.64);
        --text-tertiary: rgb(245 245 243 / 0.5);
        --accent: #3b8ef3;
        --accent-hover: #529df7;
        --danger: #e55c55;
        --danger-surface: rgb(229 92 85 / 0.16);
        --green: #4cc395;
        --green-surface: rgb(76 195 149 / 0.15);
        --warning: #e5b54f;
        --warning-surface: rgb(229 181 79 / 0.15);
        --blue-surface: rgb(59 142 243 / 0.16);
        --shadow-hairline: 0 0 0 0.5px rgb(255 255 255 / 0.09);
        --shadow-card: var(--shadow-hairline), 0 2px 6px rgb(0 0 0 / 0.28);
        --shadow-popover: var(--shadow-hairline), 0 14px 34px -6px rgb(0 0 0 / 0.65), 0 3px 10px rgb(0 0 0 / 0.4);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text-primary);
        font-size: 14px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      button, input, select, textarea { font: inherit; color: inherit; }
      button { cursor: default; }
      h1, h2, p { margin: 0; }
      code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.92em; }

      /* Non-text controls get the neutral ring. Text entry never does. */
      :focus { outline: none; }
      :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
      input:not([type="checkbox"]):focus-visible,
      textarea:focus-visible { outline: none; }

      /* Prototype bar */
      .proto-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 6px 16px;
        min-height: 48px;
        padding: 6px 18px;
        background: var(--surface);
        border-bottom: 1px solid var(--separator);
      }
      .proto-title { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 13px; }
      .proto-pill {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        background: var(--blue-surface);
        color: var(--accent);
        white-space: nowrap;
      }
      .proto-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
      .proto-controls label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }

      /* Shell */
      .page { display: flex; flex-direction: column; height: 100%; }
      .app-shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 272px minmax(0, 1fr); overflow: hidden; }

      .settings-sidebar {
        background: var(--sidebar-bg);
        border-right: 1px solid var(--separator);
        display: flex;
        flex-direction: column;
        padding: 12px 12px 20px;
        overflow-y: auto;
      }
      .settings-sidebar > * { flex-shrink: 0; }
      .back-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 36px;
        padding: 0 10px;
        border: 0;
        border-radius: var(--radius-control);
        background: transparent;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }
      .back-btn:hover { background: var(--list-hover); color: var(--text-primary); }
      .search-box {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 11px;
        border-radius: var(--radius-control);
        background: var(--control);
        margin-bottom: 16px;
        color: var(--text-tertiary);
        transition: background-color var(--motion-duration) var(--motion-easing);
      }
      .search-box:focus-within { background: var(--control-hover); }
      .search-box input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 13.5px; color: var(--text-primary); }
      .search-box input::placeholder { color: var(--text-tertiary); }
      .nav-group { margin-bottom: 16px; }
      .nav-group-label { padding: 0 10px; margin-bottom: 5px; font-size: 12px; font-weight: 600; color: var(--text-tertiary); }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 36px;
        padding: 6px 10px;
        border: 0;
        border-radius: var(--radius-control);
        background: transparent;
        color: var(--text-primary);
        text-align: left;
        transition: background-color var(--motion-duration) var(--motion-easing);
      }
      .nav-item:hover { background: var(--list-hover); }
      .nav-item[aria-current="page"] { background: var(--list-selection); font-weight: 550; }
      .nav-icon { width: 20px; height: 20px; color: var(--text-secondary); flex-shrink: 0; }
      .nav-item-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .nav-empty { padding: 8px 10px; font-size: 13px; color: var(--text-secondary); }

      .settings-main { overflow-y: auto; padding: 28px 32px 64px; }
      .settings-container { max-width: 760px; margin: 0 auto; }

      /* Review notes */
      .notes {
        margin-bottom: 22px;
        padding: 12px 16px;
        border-radius: var(--radius-card);
        background: var(--blue-surface);
        font-size: 12.5px;
      }
      .notes strong { display: block; margin-bottom: 3px; font-size: 13px; }
      .notes ul { margin: 4px 0 0; padding-left: 18px; color: var(--text-secondary); }
      .notes li { margin-bottom: 2px; }

      /* Headings and tabs */
      .page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
      .page-heading h1 { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.2; }
      .page-heading p { margin-top: 4px; color: var(--text-secondary); text-wrap: pretty; }
      .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 20px; }
      .tab {
        height: 28px;
        padding: 0 12px;
        border: 0;
        border-radius: var(--radius-menu);
        background: transparent;
        color: var(--text-secondary);
        font-size: 13px;
        transition: background-color var(--motion-duration) var(--motion-easing), color var(--motion-duration) var(--motion-easing);
      }
      .tab:hover { background: var(--list-hover); color: var(--text-primary); }
      .tab[aria-selected="true"] { background: var(--list-selection); color: var(--text-primary); font-weight: 550; }

      /* Groups and rows */
      .settings-group { margin-bottom: 26px; scroll-margin-top: 12px; }
      .group-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; margin: 0 4px 6px; }
      .group-title { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
      .group-card { border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow-card); }
      .row {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 6px 20px;
        padding: 11px 16px;
        min-height: 48px;
        scroll-margin-top: 12px;
      }
      .row + .row::before, .group-card > .note + .row::before {
        content: "";
        position: absolute;
        top: 0;
        left: 16px;
        right: 16px;
        height: 1px;
        background: var(--separator);
      }
      .row.vertical { grid-template-columns: minmax(0, 1fr); }
      .row-label { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 14px; font-weight: 500; }
      .row-desc { margin-top: 1px; font-size: 12.5px; color: var(--text-secondary); text-wrap: pretty; }
      .row-control { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; min-width: 0; }
      .row.vertical .row-control { justify-content: flex-start; }
      .row.flash { animation: flash 1.4s var(--motion-easing); }
      @keyframes flash { 0%, 50% { background: var(--list-selection); } 100% { background: transparent; } }

      .note { padding: 10px 16px; font-size: 12.5px; color: var(--text-secondary); text-wrap: pretty; }
      .group-note { margin: 6px 4px 0; font-size: 12.5px; color: var(--text-secondary); text-wrap: pretty; }
      .callout { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 12px 16px; border-radius: var(--radius-card); margin-bottom: 18px; background: var(--blue-surface); }
      .callout.warning { background: var(--warning-surface); }
      .callout.compact { margin: 8px 12px 12px; padding: 10px 12px; }
      .callout-title { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-weight: 600; font-size: 13.5px; }
      .callout p { margin-top: 2px; font-size: 12.5px; color: var(--text-secondary); text-wrap: pretty; }

      /* Controls */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 30px;
        padding: 4px 13px;
        border: 0;
        border-radius: var(--radius-button);
        corner-shape: squircle;
        background: var(--control);
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        transition: background-color var(--motion-duration) var(--motion-easing), transform 100ms var(--motion-easing);
      }
      .btn:hover { background: var(--control-hover); }
      .btn:active { background: var(--control-active); transform: translateY(1px); }
      .btn.accent { background: var(--accent); color: var(--on-accent); }
      .btn.accent:hover { background: var(--accent-hover); }
      .btn.danger { background: var(--danger-surface); color: var(--danger); }
      .btn.ghost { background: transparent; color: var(--text-secondary); }
      .btn.ghost:hover { background: var(--list-hover); color: var(--text-primary); }
      .btn:disabled { opacity: 0.45; pointer-events: none; }

      .select {
        max-width: 100%;
        min-height: 30px;
        padding: 4px 8px;
        border: 0;
        border-radius: var(--radius-control);
        background: var(--control);
        font-size: 13px;
      }
      .input {
        width: 100%;
        min-height: 32px;
        padding: 6px 10px;
        border: 0;
        border-radius: var(--radius-control);
        background: var(--control);
        font-size: 13px;
        transition: background-color var(--motion-duration) var(--motion-easing);
      }
      .input:focus { background: var(--control-hover); }
      .input::placeholder { color: var(--text-tertiary); }
      .input.narrow { width: 220px; }

      .switch {
        position: relative;
        flex-shrink: 0;
        width: 34px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: var(--control-active);
        transition: background-color var(--motion-duration) var(--motion-easing);
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.25);
        transition: transform var(--motion-duration) var(--motion-easing);
      }
      .switch[aria-checked="true"] { background: var(--accent); }
      .switch[aria-checked="true"]::after { transform: translateX(14px); }
      .switch:disabled { opacity: 0.45; }

      .badge { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 550; white-space: nowrap; background: var(--control); color: var(--text-secondary); }
      .badge.green { background: var(--green-surface); color: var(--green); }
      .badge.warning { background: var(--warning-surface); color: var(--warning); }
      .badge.blue { background: var(--blue-surface); color: var(--accent); }
      .badge.red { background: var(--danger-surface); color: var(--danger); }

      .segmented { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; border-radius: var(--radius-control); background: var(--control); }
      .segment { min-height: 26px; padding: 2px 11px; border: 0; border-radius: 10px; corner-shape: squircle; background: transparent; color: var(--text-secondary); font-size: 13px; }
      .segment[aria-checked="true"] { background: var(--surface); color: var(--text-primary); font-weight: 550; box-shadow: var(--shadow-card); }

      .radio-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; }
      .radio-card {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 8px 10px;
        border: 0;
        border-radius: var(--radius-control);
        corner-shape: squircle;
        background: var(--control);
        font-size: 13px;
        text-align: left;
      }
      .radio-card:hover { background: var(--control-hover); }
      .radio-card[aria-checked="true"] { background: var(--list-selection); font-weight: 550; }
      .radio-dot { width: 14px; height: 14px; flex-shrink: 0; border-radius: 50%; background: var(--control-active); display: grid; place-items: center; }
      [aria-checked="true"] > .radio-dot { background: var(--accent); }
      [aria-checked="true"] > .radio-dot::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--on-accent); }

      details.disclosure { position: relative; }
      details.disclosure summary {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        padding: 11px 16px;
        min-height: 48px;
        list-style: none;
        border-radius: var(--radius-card);
      }
      details.disclosure summary::-webkit-details-marker { display: none; }
      details.disclosure .chev { color: var(--text-tertiary); transition: transform var(--motion-duration) var(--motion-easing); }
      details.disclosure[open] .chev { transform: rotate(90deg); }
      details.disclosure .disclosure-body { padding-bottom: 4px; }
      .row + details.disclosure::before, details.disclosure + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 16px; height: 1px; background: var(--separator); }
      .disclosure-body > .row:first-child::before { content: ""; position: absolute; top: 0; left: 16px; right: 16px; height: 1px; background: var(--separator); }
      .steps { margin: 0; padding: 0 16px 12px 34px; font-size: 13px; color: var(--text-secondary); }
      .steps li { margin-bottom: 3px; }

      .pad-canvas { display: grid; place-items: center; height: 220px; margin: 12px 16px; border-radius: var(--radius-control); background: var(--surface-well); color: var(--text-tertiary); font-size: 13px; }

      /* InfoHint: same trigger and popover geometry as ui-info-hint.tsx */
      .hint {
        display: inline-grid;
        place-items: center;
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--text-tertiary);
        transition: background-color var(--motion-duration) var(--motion-easing), color var(--motion-duration) var(--motion-easing);
      }
      .hint:hover, .hint[aria-expanded="true"] { background: var(--control); color: var(--text-primary); }
      .hint svg { width: 14px; height: 14px; }
      #hint-pop {
        position: fixed;
        z-index: 70;
        top: 0;
        left: 0;
        width: max-content;
        max-width: min(256px, calc(100vw - 16px));
        padding: 10px 12px;
        border-radius: var(--radius-popover);
        background: var(--surface-popover);
        color: var(--text-secondary);
        font-size: 12.5px;
        box-shadow: var(--shadow-popover);
        animation: pop var(--motion-duration) var(--motion-easing);
      }
      #hint-pop[hidden] { display: none; }
      @keyframes pop { from { opacity: 0; transform: scale(var(--motion-popup-scale)); } }

      dialog {
        width: min(460px, calc(100vw - 32px));
        padding: 0;
        border: 0;
        border-radius: var(--radius-popover);
        background: var(--surface-popover);
        color: var(--text-primary);
        box-shadow: var(--shadow-popover);
      }
      dialog::backdrop { background: rgb(0 0 0 / 0.4); }
      .dialog-body { display: flex; flex-direction: column; gap: 12px; padding: 18px; }
      .dialog-body h2 { font-size: 16px; font-weight: 650; }
      .dialog-body p { font-size: 13px; color: var(--text-secondary); text-wrap: pretty; }
      .dialog-body label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--text-secondary); }
      .dialog-body label.inline { flex-direction: row; align-items: center; justify-content: space-between; }
      .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

      #toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        z-index: 80;
        max-width: calc(100vw - 32px);
        padding: 7px 14px;
        border-radius: 999px;
        background: var(--surface-popover);
        box-shadow: var(--shadow-popover);
        font-size: 12.5px;
        transform: translateX(-50%);
      }
      #toast[hidden] { display: none; }

      @media (max-width: 760px) {
        .app-shell { display: block; overflow-y: auto; }
        .settings-sidebar { border-right: 0; border-bottom: 1px solid var(--separator); overflow: visible; }
        .settings-main { overflow: visible; padding: 20px 16px 48px; }
        .radio-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 540px) {
        .row { grid-template-columns: minmax(0, 1fr); }
        .row-control { justify-content: flex-start; }
        .input.narrow { width: 100%; }
        .page-heading { flex-direction: column; gap: 10px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="proto-bar">
        <div class="proto-title">
          Settings prototype
          <span class="proto-pill" id="proto-count"></span>
        </div>
        <div class="proto-controls">
          <label>View
            <select class="select" id="ctl-view">
              <option value="proposed">Proposed</option>
              <option value="today">Today's sidebar</option>
            </select>
          </label>
          <label>Host
            <select class="select" id="ctl-host">
              <option value="apple">Apple silicon Mac</option>
              <option value="intel">Intel Mac</option>
              <option value="linux">Linux</option>
            </select>
          </label>
          <label>Theme
            <select class="select" id="ctl-theme">
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </label>
          <button class="btn" id="ctl-notes" type="button" aria-pressed="true">Review notes</button>
        </div>
      </header>
      <div class="app-shell">
        <aside class="settings-sidebar" aria-label="Settings">
          <button class="back-btn" id="back-btn" type="button"><span class="nav-icon" data-icon="back"></span>Back to app</button>
          <div class="search-box">
            <span class="nav-icon" data-icon="search"></span>
            <input id="nav-search" type="search" placeholder="Search settings" aria-label="Search settings" autocomplete="off" />
          </div>
          <nav id="sidebar-nav" aria-label="Settings pages"></nav>
        </aside>
        <main class="settings-main" id="settings-main">
          <div class="settings-container" id="content"></div>
        </main>
      </div>
    </div>
    <div id="hint-pop" role="tooltip" hidden></div>
    <div id="toast" role="status" hidden></div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>

    <script>
      "use strict";

      /* ---------- Icons (lucide outlines; Memory is the app's SD card) ---------- */
      const svg = (body) => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
      const ICONS = {
        back: svg('<path d="m15 18-6-6 6-6"/>'),
        search: svg('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'),
        info: svg('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>'),
        chevron: svg('<path d="m9 18 6-6-6-6"/>'),
        server: svg('<rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6 6h.01M6 18h.01"/>'),

      /* ---------- Pages, mirroring SETTINGS_PAGES ---------- */
      const PAGES = [

        { group: "App", id: "shortcut", title: "Keyboard shortcuts", tabs: ["shortcut"] },
        { group: "App", id: "about", title: "About", tabs: ["about"] },
      ];

      /* Today's order from SETTINGS_DESTINATIONS, for comparison. */
      const TODAY = {
        Agent: ["providers", "modelData", "limits", "skills", "mcp", "websearch", "imageGeneration", "telegram", "remoteAccess", "scheduledTasks", "geminiLive", "approvals", "computerUse", "bots", "botComputers", "simulator", "memory"],
        App: ["voice", "tts", "links", "shortcut", "appearance", "about"],
      };

      const sectionOf = (id) => (id === "links" ? LINKS : SECTIONS[id]);
      const isAvailable = (id) => SECTIONS[id].available ? SECTIONS[id].available() : true;
      const availableTabs = (page) => page.tabs.filter(isAvailable);
      const availablePages = () => PAGES.filter((page) => availableTabs(page).length > 0);
      const pageFor = (id) => PAGES.find((page) => page.tabs.includes(id === "links" ? "appearance" : id));
      const pageTitle = (page) => {
        const tabs = availableTabs(page);
        return tabs.length === 1 ? SECTIONS[tabs[0]].title : page.title;
      };
      const pageIcon = (page) => ICONS[page.icon || SECTIONS[page.tabs[0]].icon];
      const matches = (id, query) => {
        const s = sectionOf(id);
        return [s.title, s.todayTitle || "", s.description, ...s.keywords].some((text) => text.toLowerCase().includes(query));
      };
      const todayAvailable = (id) => id === "links" || isAvailable(id);

      /** Unavailable section: first available tab on the page, otherwise Providers. */
      function resolveSection(id) {
        if (id === "links") return "links";
        if (isAvailable(id)) return id;
        const page = pageFor(id);
        return (page && availableTabs(page)[0]) || "providers";
      }

      /* ---------- Rendering ---------- */
      function renderNav() {
        const nav = document.getElementById("sidebar-nav");
        const query = state.query.trim().toLowerCase();
        const groups = [];
        if (state.view === "today") {
          for (const [label, ids] of Object.entries(TODAY)) {
            const items = ids.filter(todayAvailable).filter((id) => !query || matches(id, query)).map((id) => {
              const s = sectionOf(id);
              return { key: id, target: id, title: s.todayTitle || s.title, icon: ICONS[s.icon], current: state.section === id };
            });
            if (items.length) groups.push({ label, items });
          }
        } else {
          const labels = [...new Set(PAGES.map((page) => page.group))];
          for (const label of labels) {
            const items = availablePages().filter((page) => page.group === label).flatMap((page) => {
              const tabs = availableTabs(page);
              const candidates = page.id === "appearance" ? ["links", ...tabs] : tabs;
              const hit = query ? candidates.find((id) => matches(id, query)) : tabs[0];
              if (!hit) return [];
              return [{ key: page.id, target: hit, title: pageTitle(page), icon: pageIcon(page), current: pageFor(state.section) === page }];
            });
            if (items.length) groups.push({ label, items });
          }
        }
        nav.innerHTML = groups.length
          ? groups.map((g) => `<div class="nav-group"><div class="nav-group-label">${esc(g.label)}</div>${g.items.map((item) => `<button type="button" class="nav-item" id="nav-${item.key}" data-target="${item.target}" ${item.current ? 'aria-current="page"' : ""}><span class="nav-icon">${item.icon}</span><span class="nav-item-title">${esc(item.title)}</span></button>`).join("")}</div>`).join("")
          : `<p class="nav-empty" role="status">No settings match “${esc(state.query.trim())}”.</p>`;
      }

      function renderContent() {
        hideHint();
        const content = document.getElementById("content");
        const id = state.section === "links" ? "appearance" : state.section;
        const section = SECTIONS[id];
        const page = pageFor(id);
        const tabs = state.view === "today" ? [id] : availableTabs(page);
        const title = state.view === "today" ? section.todayTitle || section.title : pageTitle(page);
        const showTabs = tabs.length > 1;
        const description = state.section === "links" && state.view === "today" ? LINKS.description : section.description;
        const notes = state.notes
          ? `<aside class="notes" aria-label="Review notes"><strong>What changes here</strong><ul>${(state.view === "today" ? ["Today’s sidebar with the proposed page content, for comparing navigation only."] : section.notes).map((n) => `<li>${esc(n)}</li>`).join("")}</ul></aside>`
          : "";
        const tablist = showTabs
          ? `<div class="tabs" role="tablist" aria-label="${esc(page.title)}">${tabs.map((tab) => `<button type="button" class="tab" role="tab" id="tab-${tab}" aria-controls="panel-${tab}" aria-selected="${tab === id}" tabindex="${tab === id ? 0 : -1}" data-tab="${tab}">${esc(SECTIONS[tab].title)}</button>`).join("")}</div>`
          : "";
        content.innerHTML = `${notes}<div class="page-heading"><div><h1>${esc(title)}</h1><p>${esc(description)}</p></div>${section.action || ""}</div>${tablist}<div ${showTabs ? `role="tabpanel" id="panel-${id}" aria-labelledby="tab-${id}"` : ""}>${section.render()}</div>`;
      }

      function render() {
        document.getElementById("proto-count").textContent = state.view === "today" ? "23 destinations, 2 groups" : `${availablePages().length} pages, 5 groups`;
        renderNav();

      function open(id, focusSelector) {
        state.section = resolveSection(id);
        render();
        const main = document.getElementById("settings-main");
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (state.section === "links") {
          const target = document.getElementById("links-row");
          target.scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" });
          target.classList.add("flash");
        } else if (!focusSelector?.startsWith("#tab-")) {
          main.scrollTop = 0;
          document.scrollingElement.scrollTop = 0;
        }
        if (focusSelector) document.querySelector(focusSelector)?.focus();
      }

      /* ---------- InfoHint: mirrors ui-info-hint.tsx ---------- */
      const OPEN_DELAY_MS = 250;
      const CLOSE_DELAY_MS = 120;
      const pop = document.getElementById("hint-pop");
      const H = { button: null, pinned: false, timer: undefined };

      function placeHint() {
        if (!H.button) return;
        const pad = 8;
        const offset = 6;
        const anchor = H.button.getBoundingClientRect();
        // Layout size, not getBoundingClientRect: the open animation scales the popover.
        const box = { width: pop.offsetWidth, height: pop.offsetHeight };
        const below = anchor.bottom + offset;
        const fitsBelow = below + box.height + pad <= innerHeight;
        const fitsAbove = anchor.top - offset - box.height >= pad;
        const top = fitsBelow || !fitsAbove ? below : anchor.top - offset - box.height;
        const left = Math.max(pad, Math.min(anchor.left, innerWidth - box.width - pad));
        pop.style.top = `${Math.max(pad, top)}px`;
        pop.style.left = `${left}px`;
      }
      function showHint(button, pinned) {
        clearTimeout(H.timer);
        if (H.button && H.button !== button) hideHint();
        H.button = button;
        if (pinned) H.pinned = true;
        pop.textContent = button.dataset.hint;
        pop.hidden = false;
        button.setAttribute("aria-expanded", "true");
        button.setAttribute("aria-describedby", "hint-pop");
        placeHint();
      }
      function hideHint() {
        clearTimeout(H.timer);
        H.pinned = false;
        if (H.button) {
          H.button.setAttribute("aria-expanded", "false");
          H.button.removeAttribute("aria-describedby");
        }
        H.button = null;
        pop.hidden = true;
      }
      const toggleHint = (button) => (H.button === button && H.pinned ? hideHint() : showHint(button, true));
      const scheduleHide = () => {
        if (H.button && !H.pinned && document.activeElement !== H.button) H.timer = setTimeout(hideHint, CLOSE_DELAY_MS);
      };

      document.addEventListener("pointerenter", (event) => {
        if (!(event.target instanceof Element)) return;
        if (event.target === pop) return clearTimeout(H.timer);
        if (!event.target.matches(".hint") || event.pointerType === "touch") return;
        clearTimeout(H.timer);
        const button = event.target;
        if (H.button !== button) H.timer = setTimeout(() => showHint(button, false), OPEN_DELAY_MS);
      }, true);
      document.addEventListener("pointerleave", (event) => {
        if (!(event.target instanceof Element)) return;
        if (event.target === pop) return scheduleHide();
        if (!event.target.matches(".hint")) return;
        clearTimeout(H.timer);
        scheduleHide();
      }, true);
      document.addEventListener("focusin", (event) => {
        if (event.target instanceof Element && event.target.matches(".hint") && H.button !== event.target) showHint(event.target, false);
      });
      document.addEventListener("focusout", (event) => {
        if (event.target instanceof Element && event.target.matches(".hint")) hideHint();
      });
      document.addEventListener("pointerdown", (event) => {
        if (H.button && !H.button.contains(event.target) && !pop.contains(event.target)) hideHint();
      });
      document.addEventListener("scroll", placeHint, true);
      addEventListener("resize", placeHint);

      /* ---------- Dialogs ---------- */
      const dialog = document.getElementById("dialog");
      const DIALOGS = {
        telegramConnect: {
          title: "Connect Telegram?",
          body: "<p>Telegram turns run with full unattended authority, with no approval prompts. Only the paired owner can trigger turns.</p>",
          confirm: "Enable and connect",
          onConfirm: () => { state.telegram.enabled = true; renderContent(); },
        },
        pairedControls: {
          title: "Allow paired-device chat controls?",
          body: "<p>Paired clients may request access to theme, chat width, Memory, Web Search and Skills controls on this host. Their pairing and workspace grants, app policy and existing setup requirements still apply. This does not allow credentials, terminal access or arbitrary app administration.</p>",
          confirm: "Allow",
          onConfirm: () => document.querySelector('[data-confirm="pairedControls"]')?.setAttribute("aria-checked", "true"),
        },
        addModel: {
          title: "Add model by ID",
          body: `<p>Add a model the lists don’t include yet. Aiden checks the ID format here; the provider checks the rest when you generate.</p>
            <label>Provider ${select("Provider for the new model", ["OpenRouter", "fal", "Replicate"])}</label>
            <label>Model ID <input class="input" type="text" placeholder="fal-ai/endpoint" /></label>
            <label>Name (optional) <input class="input" type="text" /></label>
            <label>Edit endpoint (optional) <input class="input" type="text" placeholder="fal-ai/endpoint/edit" /></label>
            <label>Reference image input (optional) ${select("Reference image input", ["image_input", "input_images"])}</label>
            <label class="inline">Takes reference images ${sw("Takes reference images")}</label>`,
          confirm: "Add model",
          onConfirm: () => toast("Prototype only: nothing was added"),
        },
      };
      let dialogConfirm = () => {};
      function openDialog(name) {
        const d = DIALOGS[name];
        dialogConfirm = d.onConfirm;
        dialog.innerHTML = `<form method="dialog" class="dialog-body"><h2 id="dialog-title">${esc(d.title)}</h2>${d.body}<div class="dialog-actions"><button class="btn" value="cancel">Cancel</button><button class="btn accent" value="confirm">${esc(d.confirm)}</button></div></form>`;
        dialog.returnValue = "cancel";
        dialog.showModal();
      }
      dialog.addEventListener("close", () => { if (dialog.returnValue === "confirm") dialogConfirm(); });

      /* ---------- Toast ---------- */
      const toastEl = document.getElementById("toast");
      let toastTimer;
      function toast(text) {
        toastEl.textContent = text;
        toastEl.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toastEl.hidden = true; }, 1800);
      }

      /* ---------- Events ---------- */
      function selectRadio(radio) {
        const radios = [...radio.closest('[role="radiogroup"]').querySelectorAll('[role="radio"]')];
        for (const r of radios) {
          r.setAttribute("aria-checked", String(r === radio));
          r.tabIndex = r === radio ? 0 : -1;
        }
      }

      document.addEventListener("click", (event) => {
        const t = event.target instanceof Element ? event.target : null;
        if (!t) return;
        const hintButton = t.closest(".hint");
        if (hintButton) return toggleHint(hintButton);

        const nav = t.closest(".nav-item");
        if (nav) {
          open(nav.dataset.target, `#${nav.id}`);
          /* Below 760px the sidebar sits above the page, so bring the page into view. */
          if (state.section !== "links" && matchMedia("(max-width: 760px)").matches) {
            document.getElementById("settings-main").scrollIntoView({ block: "start" });
          }
          return;
        }

        const tab = t.closest('[role="tab"]');
        if (tab) return open(tab.dataset.tab, `#tab-${tab.dataset.tab}`);

        const radio = t.closest('[role="radio"]');
        if (radio) return selectRadio(radio);

        const toggle = t.closest('[role="switch"]');
        if (toggle) {
          if (toggle.dataset.confirm && toggle.getAttribute("aria-checked") === "false") return openDialog(toggle.dataset.confirm);
          const on = toggle.getAttribute("aria-checked") !== "true";
          toggle.setAttribute("aria-checked", String(on));
          if (toggle.dataset.offNote) document.getElementById(toggle.dataset.offNote).hidden = on;
          return;
        }

        const action = t.closest(".btn");
        if (!action || action.closest("dialog") || action.closest(".proto-bar")) return;
        if (action.dataset.dialog) return openDialog(action.dataset.dialog);
        if (action.dataset.cf) { state.cloudflare = action.dataset.cf; return renderContent(); }
        if (action.dataset.tg === "token") { state.telegram.tokenSaved = true; return renderContent(); }
        if (action.dataset.tg === "disconnect") { state.telegram.enabled = false; return renderContent(); }
        toast("Prototype only: this action does nothing");
      });

      document.addEventListener("keydown", (event) => {
        const t = event.target instanceof Element ? event.target : null;
        if (event.key === "Escape" && H.button) return hideHint();
        if (!t) return;

        if (t.matches(".hint") && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          return toggleHint(t);
        }

        const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[event.key];
        if (t.matches('[role="tab"]')) {
          const tabs = [...t.parentElement.children];
          const index = tabs.indexOf(t);
          const next = event.key === "Home" ? tabs[0] : event.key === "End" ? tabs[tabs.length - 1]
            : event.key === "ArrowRight" || event.key === "ArrowLeft" ? tabs[(index + step + tabs.length) % tabs.length] : null;
          if (next) {
            event.preventDefault();
            open(next.dataset.tab, `#tab-${next.dataset.tab}`);
          }
          return;
        }
        if (t.matches('[role="radio"]') && step) {
          event.preventDefault();
          const radios = [...t.closest('[role="radiogroup"]').querySelectorAll('[role="radio"]')];
          const next = radios[(radios.indexOf(t) + step + radios.length) % radios.length];
          selectRadio(next);
          next.focus();
        }
      });

      document.addEventListener("change", (event) => {
        const t = event.target;
        if (t.matches("[data-exposure]")) {
          t.closest(".row").querySelector("[data-exposure-help]").textContent = EXPOSURE_HELP[t.value];
        } else if (t.matches("[data-tts-key]")) {
          document.getElementById("tts-dedicated").hidden = t.value !== "Dedicated key";
        } else if (t.matches("[data-shortcut]")) {
          t.closest(".row").querySelector("[data-shortcut-help]").textContent = {
            "Tap or hold": "Tap to toggle, or hold to talk.",
            "Hold to dictate": "Hold the shortcut while you speak.",
            "Press to toggle": "Press to start and press again to stop.",
          }[t.value];
        }
      });

      document.getElementById("nav-search").addEventListener("input", (event) => {
        state.query = event.target.value;
        renderNav();
      });
      document.getElementById("back-btn").addEventListener("click", () => toast("Prototype only: Back to app leaves Settings"));
      document.getElementById("ctl-view").addEventListener("change", (event) => {
        state.view = event.target.value;
        if (state.view === "proposed" && !isAvailable(state.section === "links" ? "appearance" : state.section)) state.section = "providers";
        render();
      });
      document.getElementById("ctl-host").addEventListener("change", (event) => {
        state.host = event.target.value;
        state.section = resolveSection(state.section);
        render();
      });
      document.getElementById("ctl-theme").addEventListener("change", (event) => {
        document.documentElement.dataset.theme = event.target.value;
      });
      document.getElementById("ctl-notes").addEventListener("click", (event) => {
        state.notes = !state.notes;
        event.currentTarget.setAttribute("aria-pressed", String(state.notes));
        renderContent();
      });

      document.querySelectorAll("[data-icon]").forEach((el) => { el.innerHTML = ICONS[el.dataset.icon]; });
      render();
    </script>
  </body>
</html>
